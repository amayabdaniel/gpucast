{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpucast-alerts
  labels:
    app.kubernetes.io/name: gpucast
spec:
  groups:
    - name: gpucast.inference.cost
      rules:
        # Per-request inference cost spike. Prior version compared the
        # lifetime gauge `gpucast_inference_cost_usd` against 0.10 USD —
        # which fired on any production traffic within seconds, since the
        # gauge is TOTAL spend since the last vLLM restart and crosses
        # $0.10 instantly. The description claimed "costs $X/request"
        # while $value was in fact cumulative lifetime cost; the tenant
        # label was always literal "all" since gpucast removed the tenant
        # dimension at 25f2f7a. The rate-based form below is the actual
        # per-request cost: cost accrued per 5-minute window divided by
        # requests served in that window. Threshold raised to $0.05/req
        # which is a defensible per-request alert (a $0.80/hr GPU
        # generating ~1k tokens/req at 20 tokens/sec costs about $0.011,
        # so $0.05 flags ~5x normal). The tenant label is dropped from
        # the description since it carries no information.
        - alert: InferenceCostSpike
          expr: rate(gpucast_inference_cost_usd_total[5m]) / rate(gpucast_inference_requests_total[5m]) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High per-request inference cost detected"
            description: "Model {{ "{{" }} $labels.model {{ "}}" }} costs ${{ "{{" }} $value {{ "}}" }}/request over the last 5m — rate-based, so a cold-start spike that resolves clears the alert within the window."

    - name: gpucast.inference.latency
      rules:
        - alert: HighTimeToFirstToken
          expr: histogram_quantile(0.95, rate(gpucast_time_to_first_token_seconds_bucket[5m])) > 2.0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "TTFT p95 exceeds 2 seconds"
            description: "Model {{ "{{" }} $labels.model {{ "}}" }} TTFT p95 is {{ "{{" }} $value {{ "}}" }}s."

        - alert: SlowInferenceRequests
          expr: histogram_quantile(0.95, rate(gpucast_gpu_seconds_per_request_bucket[5m])) > 5.0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GPU seconds per request p95 exceeds 5s"
            description: "Model {{ "{{" }} $labels.model {{ "}}" }} using {{ "{{" }} $value {{ "}}" }}s GPU time per request."

    - name: gpucast.gpu.efficiency
      rules:
        # `GPUUnderutilized` lived here firing on
        # `gpucast_gpu_utilization_percent < 20`. The metric name said
        # GPU utilization; the value was vLLM's KV-cache occupancy (a
        # low KV cache means efficient batching, not an idle GPU), so
        # the alert was INVERTED — it fired on well-behaved workloads
        # and told operators to consolidate exactly the models worth
        # keeping. Removed with the metric rename rather than
        # relabelled, because "KV cache below 20%" is not a useful
        # alert condition in its own right (efficient use looks the
        # same as idle load from the KV-cache side). Honest
        # re-introduction path: add a KV-cache HIGH alert (near
        # saturation signals preemptions / memory pressure) when
        # someone sets a defensible threshold, OR wire a real GPU-
        # utilization source (DCGM / nvidia-smi) and add a utilization
        # alert back on that.

        - alert: LowTokenEfficiency
          expr: gpucast_tokens_per_gpu_dollar < 5000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Low token efficiency"
            description: "Model {{ "{{" }} $labels.model {{ "}}" }} producing only {{ "{{" }} $value {{ "}}" }} tokens per GPU dollar. Consider quantization or a smaller model."
{{- end }}
